# Nginx reverse proxy for doctieuthuyet-mcp
# Place in /etc/nginx/sites-available/mcp.doctieuthuyet.com
# Then symlink: ln -s /etc/nginx/sites-available/mcp.doctieuthuyet.com /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name mcp.doctieuthuyet.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.doctieuthuyet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.doctieuthuyet.com/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Keep the public path exact; do not rewrite it to a legacy handler.
    location = /mcp {
        proxy_pass http://127.0.0.1:8792/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Explicitly preserve the two headers used by Streamable HTTP MCP.
        proxy_pass_request_headers on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header MCP-Session-ID $http_mcp_session_id;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8792/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name mcp.doctieuthuyet.com;
    return 301 https://$host$request_uri;
}
