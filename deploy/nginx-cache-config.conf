# ══════════════════════════════════════════════════════════════
# DTT - doctieuthuyet.com : Cấu hình nginx
# Fix #3: Page cache (fastcgi_cache) — giải quyết TTFB 1-5s
# Fix #4: Cache-Control cho static assets
#
# Cách áp dụng (SSH vào server 51.79.53.190):
#   1. Mở file vhost của site, thường là:
#      /etc/nginx/sites-available/doctieuthuyet.com
#      hoặc /etc/nginx/conf.d/doctieuthuyet.conf
#   2. Dán block "fastcgi_cache_path" lên ĐẦU file (ngoài server{}),
#      các location còn lại dán BÊN TRONG server{} hiện có.
#   3. Kiểm tra & reload:
#      nginx -t && systemctl reload nginx
# ══════════════════════════════════════════════════════════════

# ── Đặt NGOÀI server{} (đầu file) ──
fastcgi_cache_path /var/cache/nginx/dtt levels=1:2 keys_zone=DTTCACHE:100m
                   max_size=2g inactive=24h use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";


server {
    # ... giữ nguyên các cấu hình listen/server_name/ssl hiện có ...

    # ══════════════════════════════════════════════════════════
    # FIX #4: CACHE-CONTROL CHO STATIC ASSETS
    # Trước đó: chỉ có Last-Modified/ETag → trình duyệt phải
    # revalidate từng file mỗi lần quay lại + origin chậm (15.8s/file)
    # ══════════════════════════════════════════════════════════
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Static "HIT-FROM-NGINX";
        access_log off;
        try_files $uri =404;
    }

    # ══════════════════════════════════════════════════════════
    # FIX #3: PAGE CACHE — cache toàn trang HTML ở tầng nginx
    # Giảm TTFB từ ~1-5s xuống <100ms với khách chưa đăng nhập
    # ══════════════════════════════════════════════════════════
    set $skip_cache 0;

    # KHÔNG cache: admin, ajax, giỏ/đăng nhập, search, user đã login
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|^/feed|index.php|sitemap") {
        set $skip_cache 1;
    }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|dtt_user") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        # ... giữ nguyên fastcgi_pass / fastcgi_param hiện có ...
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # ← sửa lại theo bản PHP đang chạy

        fastcgi_cache DTTCACHE;
        fastcgi_cache_valid 200 301 302 12h;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-DTT-Cache $upstream_cache_status always;

        # Header cache HTML do theme tự gửi (max-age=3600)
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        include snippets/fastcgi-php.conf;
    }

    # Purge tự động khi WordPress cập nhật bài viết (kèm plugin/mu-plugin bên dưới)
    # Xem mục "Purge cache" trong CAI_DAT_CACHE_CDN.md

    location ~ /purge(/.*) {
        allow 127.0.0.1;
        deny all;
        proxy_cache_purge DTTCACHE "$scheme$request_method$host$1";
    }
}
