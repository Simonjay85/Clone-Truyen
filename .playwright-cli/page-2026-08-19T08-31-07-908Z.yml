              - 'heading "Thân thế Ninh Diêu: sinh ra giữa một thành trì chỉ biết cầm kiếm mà sống" [level=2] [ref=e141]'
              - paragraph [ref=e142]:
                - text: Muốn hiểu Ninh Diêu trước hết phải hiểu
                - link "Kiếm Khí Trường Thành" [ref=e143] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/kiem-khi-truong-thanh-la-gi/
                - text: . Đây không phải một tông môn yên bình nơi đệ tử sáng luyện kiếm, tối nghe trưởng bối giảng đạo. Nó là một chiến tuyến tồn tại qua nhiều thế hệ, ngăn Man Hoang Thiên Hạ và yêu tộc tràn sang. Một đứa trẻ sinh ra ở đây từ nhỏ đã nghe tên người chết, biết thành trì có thể vỡ, biết kiếm không chỉ dùng để biểu diễn.
              - paragraph [ref=e144]: Ninh Diêu trưởng thành trong môi trường đó nên tính cách rất khác nhiều nữ tu ở Hạo Nhiên Thiên Hạ. Cô ít vòng vo, không quá quan tâm lễ nghi hình thức và nhìn chiến đấu như một phần tự nhiên của đời sống. Với người ở nơi chiến tranh có thể tới bất cứ lúc nào, việc biết mình muốn gì và dám chịu hậu quả quan trọng hơn việc nói sao cho đẹp.
              - paragraph [ref=e145]: Thân thế cao khiến Ninh Diêu được chú ý, nhưng cũng tạo áp lực. Cô là con của kiếm tiên, lại có thiên phú khiến người khác gần như mặc định cô phải trở thành người đứng đầu thế hệ trẻ. Trong bối cảnh đó, Ninh Diêu không có quyền “chỉ làm con gái của ai đó”; cô phải dùng chính kiếm của mình để chứng minh mình là Ninh Diêu.
              - heading "Cha mẹ Ninh Diêu là ai? Vì sao cái chết của họ ảnh hưởng lớn tới cô?" [level=2] [ref=e146]
              - paragraph [ref=e147]: Zongheng mô tả Ninh Diêu là con gái của một đôi kiếm tiên Kiếm Khí Trường Thành. Cha mẹ cô tử trận trong một cuộc cược đấu với yêu tộc. Sau cái chết ấy, gia đình còn chịu những ánh nhìn và lời trách móc từ người khác, khiến tuổi thơ Ninh Diêu không chỉ có mất mát mà còn có áp lực danh dự.
              - paragraph [ref=e148]: Chi tiết này giúp giải thích vì sao Ninh Diêu rất nhạy với việc một người có tự chịu trách nhiệm cho lựa chọn của mình hay không. Cô không thích người dùng danh nghĩa tập thể để đẩy lỗi cho một cá nhân, cũng không thích người núp sau xuất thân để tránh trả giá.
              - paragraph [ref=e149]: Cha mẹ là kiếm tiên nhưng Ninh Diêu không được “thừa kế” một đời an nhàn. Ngược lại, chính vì gia đình đã trả giá lớn, cô càng phải tự xây uy tín bằng chiến lực của mình.
              - 'heading "Tính cách Ninh Diêu: lạnh lùng hay chỉ quá thẳng?" [level=2] [ref=e150]'
              - paragraph [ref=e151]: "Ninh Diêu thường được mô tả là lạnh, nhưng “thẳng” chính xác hơn. Cô không thích kéo dài những cuộc đối thoại chỉ để giữ mặt mũi. Thích thì công nhận, không thích thì không giả vờ. Kiếm đạo của cô cũng giống tính cách: trực tiếp, sắc và không cần quá nhiều lớp ngụy trang."
              - heading "1. Thẳng thắn" [level=3] [ref=e152]
              - paragraph [ref=e153]: Đây là đặc điểm dễ thấy nhất trong tuyến tình cảm. Khi Ninh Diêu nhận ra tình cảm, cô không xây hàng trăm chương hiểu lầm chỉ để kéo dài. Có ngượng, có khoảng cách, nhưng cuối cùng vẫn nói rõ.
              - heading "2. Độc lập" [level=3] [ref=e154]
              - paragraph [ref=e155]: Ninh Diêu yêu Trần Bình An nhưng không biến mình thành người “đi theo nam chính”. Khi Trần Bình An có Lạc Phách Sơn, Ninh Diêu vẫn có Kiếm Khí Trường Thành và Phi Thăng Thành. Hai người gặp nhau ở những mốc lớn nhưng không nuốt mất cuộc đời nhau.
              - heading "3. Kiêu hãnh dựa trên thực lực" [level=3] [ref=e156]
              - paragraph [ref=e157]: Ninh Diêu biết mình rất mạnh và không cần giả vờ khiêm tốn. Sự kiêu hãnh ấy không phải nói miệng; nó được hậu thuẫn bởi thiên phú, tốc độ thăng cảnh và chiến tích.
              - heading "4. Quyết đoán" [level=3] [ref=e158]
              - paragraph [ref=e159]: Kiếm tu càng do dự càng dễ chết. Ninh Diêu có năng lực ra quyết định rất nhanh, đặc biệt khi chiến trường đã rõ.
              - heading "5. Không thích dùng tình cảm để ép người" [level=3] [ref=e160]
              - paragraph [ref=e161]: Đây là điểm làm cặp Trần Bình An – Ninh Diêu bền. Cô không yêu cầu Trần Bình An bỏ Lạc Phách Sơn để theo mình, và Trần Bình An cũng không yêu cầu cô bỏ Phi Thăng Thành.
              - heading "Ninh Diêu gặp Trần Bình An như thế nào?" [level=2] [ref=e162]
              - paragraph [ref=e163]: "Ninh Diêu xuất hiện từ giai đoạn Ly Châu Động Thiên khi đang bị thương. Do nhân quả liên quan Lục Trầm và những người quanh tiểu trấn, cô được Trần Bình An chăm sóc. Đây là lần gặp có khoảng cách thân phận rất lớn: Ninh Diêu đã là thiên tài kiếm tu của Kiếm Khí Trường Thành, còn Trần Bình An chỉ là thiếu niên nghèo ở ngõ Nê Bình."
              - paragraph [ref=e164]: Điểm quan trọng là Trần Bình An giúp cô trước khi thật sự hiểu “Ninh Diêu đáng giá bao nhiêu”. Đối với một người từ nhỏ đã bị người khác nhìn bằng thiên phú, sự giúp đỡ không tính toán này tạo ấn tượng rất khác.
              - paragraph [ref=e165]: Hai người sau đó cùng đối địch Bàn Sơn Viên, cùng trải qua nguy hiểm trong tiểu trấn. Tình cảm không xuất hiện từ một cảnh “vừa gặp đã yêu” đơn giản, mà từ việc nhìn thấy người kia làm gì khi tình huống khó.
              - 'heading "Hám Sơn Phổ: Ninh Diêu có phải người dẫn Trần Bình An vào võ đạo?" [level=2] [ref=e166]'
              - paragraph [ref=e167]:
                - text: Zongheng ghi Ninh Diêu từng dạy Trần Bình An quyền phổ
