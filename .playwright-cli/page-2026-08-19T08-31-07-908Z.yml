                - text: ", là con gái của một đôi kiếm tiên và được Zongheng mô tả như một trong những kiếm tu có thiên phú cao nhất từ xưa tới nay. Nếu Trần Bình An đi lên bằng một hành trình chậm, nặng căn cơ và liên tục bị số phận lấy mất thứ mình vừa có, thì Ninh Diêu lại đại diện cho một loại thiên tài gần như sinh ra đã phù hợp với kiếm đạo: kiếm tâm thuần, quyết đoán, thăng cảnh cực nhanh và có sát lực khiến việc chỉ nhìn cảnh giới thường không đủ để đánh giá."
              - paragraph [ref=e69]:
                - text: Tuy nhiên, nếu chỉ gọi Ninh Diêu là “người yêu của Trần Bình An” thì sẽ làm nhỏ nhân vật. Cô có quê hương riêng, lịch sử gia đình riêng, chiến trường riêng, thế lực riêng và trách nhiệm riêng. Khi Trần Bình An dần xây Lạc Phách Sơn, Ninh Diêu lại đi cùng
                - link "Kiếm Khí Trường Thành" [ref=e70] [cursor=pointer]:
