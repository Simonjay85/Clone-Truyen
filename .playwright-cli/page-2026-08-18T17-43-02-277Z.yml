                  - row [ref=f1e354]:
                    - cell "Chỉ Cảnh tầng 10" [ref=f1e355]
                    - cell [ref=f1e356]:
                      - text: Khí Thịnh → Quy Chân →
                      - strong [ref=f1e357]: Thần Đáo
              - paragraph [ref=f1e358]:
                - text: Xem chi tiết tại
                - link "Cảnh giới Kiếm Lai" [ref=f1e359] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/canh-gioi-kiem-lai/
                - text: và
                - link "Bản mệnh phi kiếm" [ref=f1e360] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ban-menh-phi-kiem-la-gi/
                - text: ". Cần phân biệt rõ cảnh giới với chức vị: Ẩn Quan, Vương Tọa, Đại Thiên Sư, quốc sư hay thành chủ đều không phải tên một tầng tu vi."
              - 'heading "Timeline Kiếm Lai: 10 chặng lớn dễ nhớ" [level=2] [ref=f1e361]'
              - list [ref=f1e362]:
                - listitem [ref=f1e363]:
                  - strong [ref=f1e364]: "Ly Châu Động Thiên:"
                  - text: Trần Bình An, Ninh Diêu, Tề Tĩnh Xuân, Lưu Tiện Dương, Cố Xán, Nguyễn Cung, Dương lão đầu, Tống Tập Tân, Trĩ Khuê cùng xuất hiện trong một tiểu trấn đầy đại nhân quả.
                - listitem [ref=f1e365]:
                  - strong [ref=f1e366]: "Hộ tống trẻ tới Sơn Nhai:"
                  - text: Lý Bảo Bình, Lý Hòe, Lâm Thủ Nhất đi học; A Lương, Ngụy Bách và hệ Nho gia mở rộng bản đồ.
                - listitem [ref=f1e367]:
                  - strong [ref=f1e368]: "Giang hồ phương nam:"
                  - text: Trần Bình An gặp Từ Viễn Hà – Trương Sơn Phong, học cách nhìn yêu – người – thần ngoài sách.
                - listitem [ref=f1e369]:
                  - strong [ref=f1e370]: "Lão Long Thành – Quế Hoa Đảo – Đảo Huyền Sơn:"
                  - text: nam chính bước vào mạng thương nghiệp xuyên châu; Phù Nam Hoa, Phù gia, Phạm gia, Quế di, Mã Trí cho thấy tiền – hàng – chiến lực gắn nhau thế nào.
                - listitem [ref=f1e371]:
                  - strong [ref=f1e372]: "Ngẫu Hoa Phúc Địa:"
                  - text: tái tạo nền tu hành, gặp Bùi Tiền, Tào Tình Lãng, Chu Liễm.
                - listitem [ref=f1e373]:
                  - strong [ref=f1e374]: "Thư Giản Hồ:"
                  - text: bài toán Cố Xán buộc Trần Bình An học cách giảng đạo lý khi người sai là người thân.
                - listitem [ref=f1e375]:
                  - strong [ref=f1e376]: "Bắc Câu Lô:"
                  - text: luyện quyền với Lý Nhị, gặp Hỏa Long Chân Nhân, Tề Cảnh Long, Thái Huy Kiếm Tông, Bạch Thủ và mài tâm cảnh.
                - listitem [ref=f1e377]:
                  - strong [ref=f1e378]: "Kiếm Khí Trường Thành:"
                  - text: gặp Trần Thanh Đô, trở thành Ẩn Quan, tham gia hệ tình báo – chiến lược.
                - listitem [ref=f1e379]:
                  - strong [ref=f1e380]: "Đại chiến Man Hoang:"
                  - text: Phù Diêu, Đồng Diệp và nhiều châu thành chiến trường; Bạch Dã, Trọng Quang, Chu Mật, Lưu Xoa đều cho thấy chiến tranh là hệ thống chứ không phải solo.
                - listitem [ref=f1e381]:
                  - strong [ref=f1e382]: "Hậu chiến:"
                  - text: Phi Thăng Thành phát triển tại Ngũ Thải; Thanh Bình Kiếm Tông được lập; tam giáo tổ sư tán đạo; Lạc Phách Sơn mở rộng; Đại Ly hoàn thiện hệ sơn thủy và Trần Bình An về sau gánh thêm vị trí quốc sư với Ngũ Nhạc – Tề Độ – sông hồ trên phương ấn.
