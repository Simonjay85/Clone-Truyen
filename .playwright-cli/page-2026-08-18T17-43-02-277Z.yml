              - heading "Tề Độ hay Tề Độc mới đúng?" [level=3] [ref=f1e679]
              - paragraph [ref=f1e680]:
                - text: Chính văn dùng tên riêng
                - strong [ref=f1e681]: 齐渡
                - text: ", vì vậy cluster dùng"
                - strong [ref=f1e682]: Tề Độ
                - text: . “Đại độc” là khái niệm
                - strong [ref=f1e683]: 大渎
                - text: chỉ loại thủy đạo lớn, không phải tên riêng của Tề Độ.
              - heading "Thác Nguyệt Sơn và Thập Vạn Đại Sơn có phải một nơi?" [level=3] [ref=f1e684]
              - paragraph [ref=f1e685]: Không. Thác Nguyệt Sơn là trung tâm quyền lực/nghị sự lớn của Man Hoang; Thập Vạn Đại Sơn là lãnh địa gắn với lão mù và có quy củ riêng.
              - heading "Bạch Ngọc Kinh là gì?" [level=3] [ref=f1e686]
              - paragraph [ref=f1e687]: Trung tâm Đạo gia Thanh Minh Thiên Hạ, nổi tiếng với cấu trúc Ngũ Thành Thập Nhị Lâu và hệ chưởng giáo như Dư Đấu – Lục Trầm.
              - heading "Á Thánh có phải phản diện của Văn Thánh?" [level=3] [ref=f1e688]
              - paragraph [ref=f1e689]: Không. Hai học mạch có Tam Tứ chi tranh và bất đồng tư tưởng sâu, nhưng đều thuộc hệ Nho gia Hạo Nhiên.
              - heading "Tề Cảnh Long và Lưu Cảnh Long có phải một người?" [level=3] [ref=f1e690]
              - paragraph [ref=f1e691]: Có. Chính văn dùng cả 齐景龙 và 刘景龙 cho cùng nhân vật; lúc chính thức xưng danh với Ninh Diêu, anh dùng “Thái Huy Kiếm Tông Lưu Cảnh Long”.
              - heading "Đảo Huyền Sơn và Kiếm Khí Trường Thành có phải một nơi?" [level=3] [ref=f1e692]
              - paragraph [ref=f1e693]: Không. Đảo Huyền Sơn là cửa ngõ – đầu mối hậu cần trước chiến tranh; Kiếm Khí Trường Thành là cộng đồng kiếm tu và chiến tuyến trực tiếp với Man Hoang.
              - heading "Dương lão đầu là ai?" [level=3] [ref=f1e694]
              - paragraph [ref=f1e695]: Bề ngoài là ông già tiệm thuốc Ly Châu; bách khoa chính thức ghi căn nguyên Thanh Đồng Thiên Quân/Đông Vương Công, thuộc lớp thần đạo viễn cổ.
              - heading "Phù gia và Phạm gia khác nhau thế nào?" [level=3] [ref=f1e696]
              - paragraph [ref=f1e697]: Phù gia nổi bật ở chính danh thành chủ Lão Long, tài lực và pháp bảo; Phạm gia nổi bật ở bến – Quế Hoa Đảo – logistics xuyên châu.
              - heading "Đại Tuyền là tông môn hay vương triều?" [level=3] [ref=f1e698]
              - paragraph [ref=f1e699]: Là vương triều tại Đồng Diệp Châu; hậu kỳ Diêu Cận Chi là nữ đế.
              - generic [ref=f1e700]:
                - heading "Nguồn đối chiếu và nguyên tắc biên soạn" [level=2] [ref=f1e701]
                - paragraph [ref=f1e702]: Cluster ưu tiên trang tác phẩm, bách khoa và chương chính thức Zongheng thuộc đúng tác phẩm ID 672340. Khi dữ kiện chỉ nằm ở bách khoa mốc cũ, suy đoán nhân vật hoặc nguồn tổng hợp, bài ghi rõ mức chắc chắn thay vì biến thành sự thật cuối cùng.
