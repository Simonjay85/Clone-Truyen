                  - /url: https://doctieuthuyet.com/trinh-dai-phong-la-ai/
                - text: ", giúp nối võ đạo hiện tại với lịch sử trước tam giáo."
              - paragraph [ref=f1e189]:
                - text: Cùng lớp thần đạo còn có
                - link "Nguyễn Tú" [ref=f1e190] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/nguyen-tu-la-ai/
                - text: và
                - link "Lý Liễu" [ref=f1e191] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ly-lieu-la-ai/
                - text: qua dữ kiện chuyển thế Hỏa – Thủy Thần ở mốc bách khoa cũ;
                - link "Trĩ Khuê/Vương Chu" [ref=f1e192] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tri-khue-vuong-chu-la-ai/
                - text: lại mở tuyến chân long. Vì vậy Ly Châu không chỉ là “quê nam chính” mà còn là nút thắt của lịch sử trời đất.
              - heading "Tề Độ – thủy vận Đại Ly trên ấn quốc sư" [level=3] [ref=f1e193]
              - paragraph [ref=f1e194]:
                - link "Tề Độ (齐渡)" [ref=f1e195] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/te-do-la-gi/
                - text: là một đại thủy đạo quan trọng của Đại Ly. Chính văn hậu kỳ đặt Tề Độ cùng Ngũ Nhạc, sông ngòi và Thư Giản Hồ trên phương ấn “Đại Ly quốc sư Trần Bình An chi ấn”, gần như biến cả một nước sơn hà thành đồ án trên thành ấn.
              - paragraph [ref=f1e196]:
                - text: Bách khoa Zongheng còn ghi Vương Chu từng đi sông dọc Tề Độ. Vì vậy tuyến Tề Độ nối thẳng
                - strong [ref=f1e197]: chân long – thủy vận – quốc vận – quốc sư
                - text: . Tên riêng dùng chữ
                - strong [ref=f1e198]: 渡
                - text: nên cluster gọi Tề Độ; còn “đại độc” từ
                - strong [ref=f1e199]: 大渎
                - text: là khái niệm loại thủy đạo, không phải tên riêng.
              - heading "Đại Ly biến một tiểu động thiên thành trung tâm Bảo Bình" [level=3] [ref=f1e200]
              - paragraph [ref=f1e201]:
                - text: Sau khi động thiên thay đổi,
                - link "Đại Ly" [ref=f1e202] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dai-ly-la-gi/
                - text: tái quy hoạch Long Tuyền.
                - link "Nguyễn Cung" [ref=f1e203] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/nguyen-cung-la-ai/
                - text: gây dựng
                - link "Long Tuyền Kiếm Tông" [ref=f1e204] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/long-tuyen-kiem-tong-la-gi/
                - text: ; Trần Bình An sở hữu nhiều sơn đầu rồi dần hình thành Lạc Phách Sơn. Cùng một vùng đất sinh ra hai đạo thống mới nhưng đi hai mô hình khác nhau.
              - heading "Tam giáo tổ sư, Á Thánh, Lễ Thánh và lớp viễn cổ" [level=2] [ref=f1e205]
              - paragraph [ref=f1e206]:
                - text: "Ở tầng cao nhất của worldbuilding, ba giáo có ba vị tổ sư:"
                - link "Chí Thánh Tiên Sư" [ref=f1e207] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/chi-thanh-tien-su-la-ai/
                - text: của Nho gia,
                - link "Đạo Tổ" [ref=f1e208] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dao-to-la-ai/
                - text: của Đạo gia và
                - link "Phật Tổ" [ref=f1e209] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/phat-to-la-ai/
                - text: của Phật gia. Hậu kỳ chính văn xác nhận ba vị tán đạo, khiến trần đại đạo và trách nhiệm của nhiều thiên hạ thay đổi.
              - paragraph [ref=f1e210]:
                - text: Trong Hạo Nhiên,
                - link "Văn Miếu" [ref=f1e211] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/van-mieu-la-gi/
                - text: là trung tâm văn mạch nhưng không phải “triều đình thần tiên”.
                - link "Lễ Thánh" [ref=f1e212] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/le-thanh-la-ai/
                - text: đặc biệt gắn với lễ chế, quy củ và chính danh đại diện Hạo Nhiên;
                - link "Á Thánh" [ref=f1e213] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/a-thanh-la-ai/
                - text: là trụ học mạch lớn khác, gắn với Tam Tứ chi tranh;
                - link "Văn Thánh" [ref=f1e214] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/van-thanh-la-ai/
                - text: phát triển học mạch riêng. Tranh luận giữa Á Thánh và Văn Thánh nên được đọc như xung đột tư tưởng trong cùng Nho gia, không phải câu chuyện “phe tốt – phe xấu”.
              - paragraph [ref=f1e215]:
                - link "Bạch Dã" [ref=f1e216] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bach-da-la-ai/
                - text: "là ví dụ rất đẹp về người đọc sách không đồng nghĩa yếu chiến đấu: ở mốc đại chiến, ông 14 cảnh, Hợp Đạo với thơ trong lòng và cầm tiên kiếm Thái Bạch, tới mức Man Hoang phải dùng chiến dịch nhiều Vương Tọa để bào mòn."
              - heading "Tam Sơn Cửu Hầu tiên sinh – dấu vết viễn cổ trong phù lục" [level=3] [ref=f1e217]
              - paragraph [ref=f1e218]:
                - link "Tam Sơn Cửu Hầu tiên sinh" [ref=f1e219] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tam-son-cuu-hau-tien-sinh-la-ai/
                - text: là một đại tu sĩ viễn cổ được chính văn hậu kỳ xếp vào nhóm Thập Hào hậu bổ và xác nhận 14 cảnh ở mốc đó. Điều thú vị là tên ông đã xuất hiện rất sớm trong câu sắc lệnh phù lục “phụng Tam Sơn Cửu Hầu tiên sinh luật lệnh”.
              - paragraph [ref=f1e220]: "Đây là kiểu gieo lore đặc trưng của truyện: một câu chú ở đầu truyện có thể là dấu vết của đại nhân vật viễn cổ tới hàng nghìn chương sau mới được giải thích."
              - heading "Đạo gia – Bạch Ngọc Kinh – Bắc Câu Lô" [level=2] [ref=f1e221]
              - paragraph [ref=f1e222]:
                - text: Đạo gia không chỉ có Thanh Minh.
                - link "Long Hổ Sơn" [ref=f1e223] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/long-ho-son-la-gi/
                - text: là trung tâm Đạo gia tại Trung Thổ Hạo Nhiên;
                - link "Hỏa Long Chân Nhân" [ref=f1e224] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/hoa-long-chan-nhan-la-ai/
                - text: tọa trấn Pha Địa Phong Bắc Câu Lô nhưng từng giữ danh phận ngoại tính Đại Thiên Sư Long Hổ Sơn;
                - link "Trương Sơn Phong" [ref=f1e225] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/truong-son-phong-la-ai/
                - text: lại là đệ tử nối tuyến đó.
              - heading "Bạch Ngọc Kinh – Ngũ Thành Thập Nhị Lâu" [level=3] [ref=f1e226]
              - paragraph [ref=f1e227]:
                - link "Bạch Ngọc Kinh" [ref=f1e228] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bach-ngoc-kinh-la-gi/
                - text: là trung tâm quyền lực và đạo thống của Thanh Minh, có cấu trúc
                - strong [ref=f1e229]: Ngũ Thành Thập Nhị Lâu
                - text: . Chính văn hậu kỳ còn so sánh mức độ quản trị của Bạch Ngọc Kinh đối với Thanh Minh chặt hơn sự ràng buộc của Văn Miếu đối với Hạo Nhiên.
              - paragraph [ref=f1e230]:
                - link "Dư Đấu" [ref=f1e231] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/du-dau-la-ai/
                - text: và
                - link "Lục Trầm" [ref=f1e232] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/luc-tram-la-ai/
                - text: "cùng là đệ tử Đạo Tổ nhưng gần như hai cực: một người thiên chiến lực – quy củ, một người thiên biến hóa – nhân quả. Nhờ đó Bạch Ngọc Kinh không phải một bộ máy vô diện."
              - heading "Thái Huy Kiếm Tông, Tề Cảnh Long và Bạch Thủ" [level=3] [ref=f1e233]
              - paragraph [ref=f1e234]:
                - link "Thái Huy Kiếm Tông" [ref=f1e235] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thai-huy-kiem-tong-la-gi/
                - text: là kiếm tông lớn Bắc Câu Lô.
                - link "Tề Cảnh Long/Lưu Cảnh Long" [ref=f1e236] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/te-canh-long-la-ai/
                - text: "là nhân vật tiêu biểu nhất: chính văn dùng cả hai tên; bản mệnh phi kiếm có thể tạo một tiểu thiên địa và phong cách chiến đấu rất kín."
              - paragraph [ref=f1e237]:
                - link "Bạch Thủ" [ref=f1e238] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bach-thu-la-ai/
                - text: là đệ tử Tề Cảnh Long. Chính văn hậu chiến xác nhận cậu đã là Kim Đan kiếm tu và được mở Phiên Nhiên Phong riêng. Tuyến Bạch Thủ giúp thấy thế hệ trẻ Bắc Câu Lô phải từ “thiên tài hay nói” thành người thật sự gánh sơn đầu sau chiến tranh.
              - heading "Đảo Huyền Sơn – Kiếm Khí Trường Thành – Phi Thăng Thành" [level=2] [ref=f1e239]
              - paragraph [ref=f1e240]:
                - link "Đảo Huyền Sơn" [ref=f1e241] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dao-huyen-son-la-gi/
                - text: trước đại chiến là cửa ngõ chiến lược giữa hậu phương Hạo Nhiên và
                - link "Kiếm Khí Trường Thành" [ref=f1e242] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/kiem-khi-truong-thanh-la-gi/
                - text: .
                - link "Quế Hoa Đảo" [ref=f1e243] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/que-hoa-dao-la-gi/
                - text: và nhiều độ thuyền chở người – hàng tới đây, sau đó mới đi sâu vào vùng kiếm khí.
              - paragraph [ref=f1e244]:
                - text: Kiếm Khí Trường Thành là cộng đồng kiếm tu giữ biên giới với Man Hoang qua thời gian rất dài.
                - link "Trần Thanh Đô" [ref=f1e245] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tran-thanh-do-la-ai/
                - text: là Lão Đại Kiếm Tiên và sơ đại Hình Quan; Long Quân là sơ đại Ẩn Quan; Quan Chiếu là sơ đại Tế Quan. Sau biến cố Tiêu Tuân, Trần Bình An giữ chức
                - link "Ẩn Quan" [ref=f1e246] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/an-quan-la-gi/
                - text: ", một chức vụ tình báo – chiến lược chứ không phải cảnh giới."
              - paragraph [ref=f1e247]:
                - text: Sau khi cục diện sụp đổ, một phần Kiếm Khí tới Ngũ Thải và phát triển thành
                - link "Phi Thăng Thành" [ref=f1e248] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/phi-thang-thanh-la-gi/
                - text: . Đảo Huyền Sơn trở thành di chỉ; những cánh cửa còn sót về sau vẫn được dùng trong kết nối và nghị sự cấp thiên hạ. Đây là ví dụ hay về hạ tầng chiến tranh có thể trở thành hạ tầng hòa đàm.
              - 'heading "Lạc Phách Sơn: từ ngôi nhà tới tông môn" [level=2] [ref=f1e249]'
              - paragraph [ref=f1e250]:
                - link "Lạc Phách Sơn" [ref=f1e251] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/lac-phach-son-la-gi/
                - text: đặc biệt vì “nhà trước, tông môn sau”.
                - link "Bùi Tiền" [ref=f1e252] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bui-tien-la-ai/
                - text: đi võ đạo;
                - link "Tào Tình Lãng" [ref=f1e253] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tao-tinh-lang-la-ai/
                - text: theo đường người đọc sách;
                - link "Chu Liễm" [ref=f1e254] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/chu-liem-la-ai/
                - text: giữ vận hành;
                - link "Trần Noãn Thụ" [ref=f1e255] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tran-noan-thu-la-ai/
                - text: là tiểu quản gia;
                - link "Trần Linh Quân" [ref=f1e256] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tran-linh-quan-la-ai/
                - text: nối thủy vận – hóa giao;
                - link "Chu Mễ Lạp" [ref=f1e257] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/chu-me-lap-la-ai/
                - text: là hữu hộ pháp;
                - link "Khương Thượng Chân" [ref=f1e258] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/khuong-thuong-chan-la-ai/
                - text: đem kinh nghiệm đại tông môn và tài lực;
                - link "Ngụy Bách" [ref=f1e259] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/nguy-bach-la-ai/
                - text: nối thần đạo Bắc Nhạc.
              - paragraph [ref=f1e260]:
                - link "Thôi Đông Sơn" [ref=f1e261] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thoi-dong-son-la-ai/
                - text: lại mở lớp hạ tông.
                - link "Thanh Bình Kiếm Tông" [ref=f1e262] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thanh-binh-kiem-tong-la-gi/
                - text: "đặt tại Đồng Diệp, khiến Lạc Phách Sơn phải học cách quản một đạo thống ở châu khác: không thể chỉ dựa vào tình nghĩa trong sân nhà."
              - 'heading "Bảo Bình: kiếm đạo, Lão Long Thành và thương nghiệp" [level=2] [ref=f1e263]'
              - heading "Phong Lôi Viên – Chính Dương Sơn – Long Tuyền Kiếm Tông" [level=3] [ref=f1e264]
              - paragraph [ref=f1e265]:
                - link "Phong Lôi Viên" [ref=f1e266] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/phong-loi-vien-la-gi/
                - text: và
                - link "Chính Dương Sơn" [ref=f1e267] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/chinh-duong-son-la-gi/
                - text: có nguồn kiếm đạo gần nhau nhưng trở thành tử địch.
                - link "Lý Đoàn Cảnh" [ref=f1e268] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ly-doan-canh-la-ai/
                - text: từng là cái bóng cực lớn của Phong Lôi Viên; sau khi ông binh giải,
                - link "Hoàng Hà" [ref=f1e269] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/hoang-ha-la-ai/
                - text: và
                - link "Lưu Bá Kiều" [ref=f1e270] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/luu-ba-kieu-la-ai/
                - text: phải chứng minh bảng hiệu có thể sống tiếp.
              - paragraph [ref=f1e271]:
                - link "Tô Giá" [ref=f1e272] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/to-gia-la-ai/
                - text: "lại làm ân oán bớt nhị nguyên: cô là nữ kiếm tu Chính Dương Sơn nhưng được Lưu Bá Kiều thật lòng ngưỡng mộ. Một người bên tử địch có thể yêu một con người bên kia, nhắc rằng trách nhiệm phải rơi đúng cá nhân chứ không phải mọi người cùng bảng hiệu."
              - 'heading "Lão Long Thành: tài lực, logistics và các gia tộc" [level=3] [ref=f1e273]'
              - paragraph [ref=f1e274]:
                - link "Lão Long Thành" [ref=f1e275] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/lao-long-thanh-la-gi/
                - text: là cửa ngõ cực nam Bảo Bình.
                - link "Phù gia" [ref=f1e276] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/phu-gia-la-gi/
                - text: là gia tộc thành chủ lâu đời, có khối tài sản – pháp bảo rất lớn;
                - link "Phạm gia" [ref=f1e277] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/pham-gia-la-gi/
                - text: mạnh ở logistics, bến và Quế Hoa Đảo;
                - link "Tôn Gia Thụ" [ref=f1e278] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ton-gia-thu-la-ai/
                - text: cho thấy nghệ thuật tính lợi nhưng giữ chữ tín;
                - link "Phạm Nhị" [ref=f1e279] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/pham-nhi-la-ai/
                - text: lại mang màu tuổi trẻ và quan hệ bằng hữu.
              - paragraph [ref=f1e280]:
                - link "Phù Nam Hoa" [ref=f1e281] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/phu-nam-hoa-la-ai/
                - text: xuất hiện ngay đầu truyện với thân phận thiếu thành chủ Lão Long Thành, vào Ly Châu mua cơ duyên và mặc cả với Tống Tập Tân. Nhờ nhân vật này, người đọc sớm thấy khoảng chênh thông tin giữa dân tiểu trấn và giới tiên gia giàu có.
              - paragraph [ref=f1e282]:
                - link "Quế di" [ref=f1e283] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/que-di-la-ai/
                - text: và
                - link "Mã Trí" [ref=f1e284] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ma-tri-la-ai/
                - text: "mở lớp vận hành Quế Hoa Đảo: Quế di là trưởng bối – quản sự, Mã Trí là Kim Đan lão kiếm tu; chính văn cho thấy họ còn trực tiếp trông việc giao nhận hàng khi cập Đảo Huyền Sơn. Nhờ cụm này, kinh tế trong"
                - emphasis [ref=f1e285]: Kiếm Lai
                - text: "trở nên thật: tiền có thể mua pháp bảo, kiếm tu có thể làm bảo hộ vận tải, một chuyến hàng sai có thể phá thương hiệu tích lũy nhiều đời."
              - 'heading "Đồng Diệp: tông môn, Đại Tuyền, phúc địa và đại chiến" [level=2] [ref=f1e286]'
              - paragraph [ref=f1e287]:
                - link "Đồng Diệp Châu" [ref=f1e288] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dong-diep-chau-la-gi/
                - text: là nơi phù hợp nhất để đọc câu hỏi “tổ chức tồn tại để làm gì khi đại nạn thật sự tới?”.
              - paragraph [ref=f1e289]:
                - link "Thái Bình Sơn" [ref=f1e290] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thai-binh-son-la-gi/
                - text: nổi bật ở phong khí trừ yêu và trách nhiệm với người dưới núi.
                - link "Ngọc Khuê Tông" [ref=f1e291] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ngoc-khue-tong-la-gi/
                - text: lại cho thấy sức mạnh tổ chức;
                - link "Tuân Uyên" [ref=f1e292] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tuan-uyen-la-ai/
                - text: là lão tổ sư để lại ảnh hưởng sâu tới Khương Thượng Chân;
                - link "Đồng Diệp Tông" [ref=f1e293] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dong-diep-tong-la-gi/
                - text: đại diện uy danh cũ phải học cách thích nghi.
              - heading "Vân Quật Phúc Địa – quyền sở hữu một thế giới nhỏ" [level=3] [ref=f1e294]
              - paragraph [ref=f1e295]:
                - link "Vân Quật Phúc Địa" [ref=f1e296] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/van-quat-phuc-dia-la-gi/
                - text: gắn với Khương thị và Khương Thượng Chân. Lịch sử từng có phản kháng từ tu sĩ bên trong; tới đại chiến Man Hoang, Khương Thượng Chân lại mở cấm chế để nhận dân chạy loạn dù việc đó làm linh khí bị chia mỏng và phẩm trật phúc địa có thể suy giảm.
              - paragraph [ref=f1e297]: "Đây là một trong những tuyến hay nhất về câu hỏi: sở hữu một phúc địa có phải chỉ là có tài sản riêng, hay chủ nhân còn phải chịu trách nhiệm với người sống bên trong?"
              - heading "Đại Tuyền – Diêu Cận Chi – Tùng Châm Hồ – Bắc Tấn" [level=3] [ref=f1e298]
              - paragraph [ref=f1e299]:
                - link "Đại Tuyền vương triều" [ref=f1e300] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dai-tuyen-vuong-trieu-la-gi/
                - text: "bổ sung lớp mà tông môn không thể thay: dân cư, biên quân, thuế, quan lại và thần đạo sắc phong. Hậu kỳ"
                - link "Diêu Cận Chi" [ref=f1e301] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dieu-can-chi-la-ai/
                - text: là nữ đế; chính văn đặt bà trên tuyến giáp
                - link "Bắc Tấn" [ref=f1e302] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bac-tan-la-gi/
                - text: cùng tu sĩ khách khanh và
                - link "Tùng Châm Hồ" [ref=f1e303] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tung-cham-ho-la-gi/
                - text: thủy thần Liễu Ấu Dung.
              - paragraph [ref=f1e304]: Cụm này cho thấy một vương triều trong thế giới thần tiên vẫn có giá trị vì nó tổ chức đời sống hàng ngày mà một cường giả không thể tự làm. Khi chiến tranh kết thúc, tông môn sửa núi; nhà nước còn phải sửa đường, ruộng, biên giới và niềm tin của dân.
              - heading "Trọng Quang – chiến tranh có chỉ huy và khai thác hồn phách" [level=3] [ref=f1e305]
              - paragraph [ref=f1e306]:
                - link "Trọng Quang" [ref=f1e307] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/trong-quang-la-ai/
                - text: là đại yêu Phi Thăng cảnh được chính văn đặt trên chiến trường giữa ba quân trướng Man Hoang và hộ sơn đại trận Ngọc Khuê Tông. Pháp bào Trầm Thải luyện hóa lượng lớn hồn phách chiến trường, cho thấy chiến tranh không chỉ chiếm đất mà còn có thể bị biến thành tài nguyên tu hành.
              - 'heading "Man Hoang: Thác Nguyệt Sơn, Thập Vạn Đại Sơn và những trung tâm khác nhau" [level=2] [ref=f1e308]'
              - paragraph [ref=f1e309]:
                - link "Man Hoang Thiên Hạ" [ref=f1e310] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/man-hoang-thien-ha-la-gi/
                - text: không phải một khối yêu tộc đồng nhất.
                - link "Chu Mật" [ref=f1e311] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/chu-mat-la-ai/
                - text: là bộ não chiến tranh;
                - link "Lưu Xoa" [ref=f1e312] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/luu-xoa-la-ai/
                - text: là đại kiếm tu;
                - link "Bạch Trạch" [ref=f1e313] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/bach-trach-la-ai/
                - text: đại diện một tầng lịch sử – lợi ích yêu tộc rộng hơn phe chủ chiến.
              - heading "Thác Nguyệt Sơn – bàn nghị sự cấp thiên hạ" [level=3] [ref=f1e314]
              - paragraph [ref=f1e315]:
                - link "Thác Nguyệt Sơn" [ref=f1e316] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thac-nguyet-son-la-gi/
                - text: gắn với đại tổ, hệ Vương Tọa, quân trướng và đại chiến Kiếm Khí Trường Thành. Hậu chiến, chính văn cho thấy hơn một trăm yêu tộc tu sĩ tập trung tại đây để nghị sự từ xa với Trung Thổ Văn Miếu.
              - paragraph [ref=f1e317]: Điều này định vị Thác Nguyệt Sơn như một trung tâm quyền lực và bàn nghị sự của Man Hoang, nhưng không nên gọi đơn giản là “thủ đô”. Man Hoang không vận hành như một vương triều tập quyền.
              - heading "Thập Vạn Đại Sơn – lãnh địa lão mù" [level=3] [ref=f1e318]
              - paragraph [ref=f1e319]:
                - link "Lão mù Man Hoang" [ref=f1e320] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/lao-mu-man-hoang-la-ai/
                - text: "lại chứng minh tính đa trung tâm: bách khoa chính thức ghi ông 14 cảnh, sống ở"
                - link "Thập Vạn Đại Sơn" [ref=f1e321] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/thap-van-dai-son-la-gi/
                - text: ", có quy củ và địa bàn riêng, không nên giản lược thành thuộc hạ Chu Mật hay chi nhánh Thác Nguyệt Sơn. Tuyến ông nhận"
                - link "Lý Hòe" [ref=f1e322] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/ly-hoai-la-ai/
                - text: làm đệ tử còn biến cậu bé tưởng bình thường nhất nhóm Sơn Nhai thành một đường đại đạo rất bất ngờ.
              - heading "Bằng hữu và đời sống ngoài đại đạo" [level=2] [ref=f1e323]
              - paragraph [ref=f1e324]:
                - text: Một trong những điểm khiến
                - emphasis [ref=f1e325]: Kiếm Lai
                - text: không biến thành bảng cảnh giới là các mối quan hệ đời thường.
                - link "Từ Viễn Hà" [ref=f1e326] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/tu-vien-ha-la-ai/
                - text: là đại nhiêm đao khách quen Trần Bình An từ chuyến giang hồ sớm; nhiều năm sau hai người vẫn có thể ngồi ăn bữa cơm nhà, chê món hơi mặn rồi bị bạn bảo ra cửa ngồi ăn.
              - paragraph [ref=f1e327]: "Đó là một loại thành công khác đại đạo: sống đủ lâu, có nhà, có bếp và có người bạn cũ tới ăn. Với một Trần Bình An từng thiếu cảm giác gia đình từ nhỏ, những bữa cơm như vậy có giá trị không kém một lần phá cảnh."
              - paragraph [ref=f1e328]: Tình bạn với Tề Cảnh Long, Trương Sơn Phong, Từ Viễn Hà, Tôn Gia Thụ hay Phạm Nhị cũng cho thấy nam chính không biến mọi người thành thuộc hạ Lạc Phách Sơn. Bằng hữu thật có thể đi đường riêng mà vẫn giữ nhau trong lòng.
              - heading "Liễu Xích Thành – một kiểu “người trong nhà” rất khác" [level=3] [ref=f1e329]
              - paragraph [ref=f1e330]:
                - link "Liễu Xích Thành" [ref=f1e331] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/lieu-xich-thanh-la-ai/
                - text: là sư đệ Trịnh Cư Trung và nhân vật gắn Lưu Ly Các – Bạch Đế Thành. Ông hay khóc, thích đạo bào hồng phấn, sợ sư huynh nhưng lại có tình sư môn rất thật. Nhân vật giúp một thế lực lạnh như Bạch Đế Thành vẫn có đời sống, tình cảm và sự buồn cười rất người.
              - heading "Cảnh giới và bản mệnh phi kiếm" [level=2] [ref=f1e332]
              - paragraph [ref=f1e333]:
                - text: Khung dễ nhớ nhất gồm
                - strong [ref=f1e334]: 15 cảnh luyện khí sĩ
                - text: và
                - strong [ref=f1e335]: 11 cảnh thuần túy võ phu
                - text: . Kiếm tu đi trong khung luyện khí nhưng chiến lực còn phụ thuộc bản mệnh phi kiếm, kiếm thuật, kiếm ý, tâm cảnh và kinh nghiệm; thần linh lại có thần vị, kim thân, hương hỏa và quyền bính địa phương.
              - table [ref=f1e336]:
                - rowgroup [ref=f1e337]:
                  - row [ref=f1e338]:
                    - columnheader "Hệ" [ref=f1e339]
                    - columnheader "Khung cảnh giới" [ref=f1e340]
                - rowgroup [ref=f1e341]:
                  - row [ref=f1e342]:
                    - cell "Luyện khí Hạ Ngũ" [ref=f1e343]
                    - cell "Đồng Bì → Thảo Căn → Liễu Cân → Cốt Khí → Chú Lô/Trúc Lư" [ref=f1e344]
                  - row [ref=f1e345]:
                    - cell "Luyện khí Trung Ngũ" [ref=f1e346]
