                    - cell "Bắc Câu Lô → Hỏa Long Chân Nhân → Trương Sơn Phong → Thái Huy Kiếm Tông → Tề Cảnh Long → Bạch Thủ → Bản mệnh phi kiếm" [ref=f1e650]
