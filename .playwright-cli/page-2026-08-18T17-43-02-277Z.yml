                      - strong [ref=f1e653]: Kiếm đạo Bảo Bình
                    - cell "Lý Đoàn Cảnh → Phong Lôi Viên → Lưu Bá Kiều → Tô Giá → Hoàng Hà → Chính Dương Sơn → Lưu Tiện Dương → Long Tuyền Kiếm Tông" [ref=f1e654]
