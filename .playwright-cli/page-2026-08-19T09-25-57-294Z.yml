                  - text: Cấu trúc nổi tiếng là Ngũ Thành Thập Nhị Lâu; tầng cao có Thượng Thanh Các. Dư Đấu và Lục Trầm là các chưởng giáo quan trọng. Chính văn xác nhận Bạch Ngọc Kinh quản Thanh Minh chặt hơn Văn Miếu quản Hạo Nhiên; một đạo quan Phi Thăng cảnh có thể chấp chưởng một thành. Tuy nhiên Thanh Minh vẫn có những đại đạo thống khác như Huyền Đô Quan, nên không phải mọi đạo sĩ đều trực thuộc Bạch Ngọc Kinh.
