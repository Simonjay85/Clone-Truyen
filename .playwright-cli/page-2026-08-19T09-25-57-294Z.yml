              - heading "Bạch Ngọc Kinh là một tòa thành, một tông môn hay cả hệ thống?" [level=2] [ref=e133]
              - paragraph [ref=e134]:
                - text: Cách hiểu tốt nhất là
                - strong [ref=e135]: một trung tâm địa lý đồng thời là một hệ thống đạo thống–quản trị
                - text: . Chính văn dùng “Bạch Ngọc Kinh” để chỉ nơi các chưởng giáo ngự trị, nhưng bên trong lại có Ngũ Thành Thập Nhị Lâu và từng đơn vị có người chấp chưởng.
              - paragraph [ref=e136]: Do đó nói Bạch Ngọc Kinh chỉ là “tông môn” sẽ thiếu tầng chính trị; gọi chỉ là “thành phố” lại thiếu đạo thống; gọi “triều đình” cũng chưa đúng vì nó gắn trực tiếp với Đạo gia và đại đạo.
              - paragraph [ref=e137]:
                - text: "Đây là một entity lai:"
                - strong [ref=e138]: đạo trường + tổ chức + thiết chế quyền lực
                - text: . Hiểu đúng type giúp người đọc dễ phân biệt nó với một tông môn như Thái Huy Kiếm Tông hoặc một vương triều như Đại Ly.
              - heading "Ngũ Thành Thập Nhị Lâu là gì?" [level=2] [ref=e139]
              - paragraph [ref=e140]:
                - text: Chương 974 dùng cụm
                - strong [ref=e141]: 五城十二楼
                - text: ", nghĩa là năm thành và mười hai lầu. Lục Trầm đứng ở nơi cao nhìn xuống toàn hệ thống, cho thấy đây là cấu trúc không gian–quyền lực thật trong Bạch Ngọc Kinh."
              - paragraph [ref=e142]: Không nên hiểu đơn giản là “17 tòa nhà du lịch”. Mỗi thành/lầu gắn với đạo quan, tiên quân, chức vị và phân cấp riêng; toàn thể tạo nên mạng Bạch Ngọc Kinh.
              - paragraph [ref=e143]: Ở tầng SEO entity, “Ngũ Thành Thập Nhị Lâu” là thuộc tính quan trọng nhất của Bạch Ngọc Kinh, giống “chín châu” với Hạo Nhiên hay “Ngũ Nhạc” với Đại Ly.
              - heading "Thượng Thanh Các là gì và vì sao lên đó là vinh dự?" [level=2] [ref=e144]
              - paragraph [ref=e145]:
                - text: Chương 974 kể một người nhận
                - strong [ref=e146]: chưởng giáo pháp chỉ
                - text: rồi ngự phong tới Thượng Thanh Các gặp Lục Trầm. Các tiên quân nhận ra quỹ tích “phi thăng” ấy và rất ngưỡng mộ, bởi có thể lên Thượng Thanh Các nhìn xuống toàn bộ Ngũ Thành Thập Nhị Lâu là một
                - strong [ref=e147]: vinh dự, biểu thị đã lọt vào pháp nhãn chưởng giáo
                - text: .
              - paragraph [ref=e148]: Điểm này cho thấy tầng cao nhất Bạch Ngọc Kinh không phải nơi đạo quan bình thường muốn tới là tới. Không gian vật lý đồng thời phản ánh cấp bậc.
              - paragraph [ref=e149]: Nó cũng giúp hiểu “chưởng giáo” không chỉ là danh dự. Một pháp chỉ có thể mở đường cho người khác bước vào tầng quyền lực cao nhất.
              - heading "Bạch Ngọc Kinh có ba vị chưởng giáo?" [level=2] [ref=e150]
              - paragraph [ref=e151]:
                - text: Bạch Ngọc Kinh nổi tiếng với cấu trúc
                - strong [ref=e152]: ba vị chưởng giáo
                - text: ", nằm trong hệ truyền thừa của Đạo Tổ. Cluster hiện đã có bài chuyên sâu cho Dư Đấu và Lục Trầm; vị trí/chức năng của từng người thay đổi theo đại cục và thời điểm."
              - paragraph [ref=e153]: Không nên nhìn ba chưởng giáo như ba CEO ngang chức đơn giản. Mỗi người có đạo pháp, tính cách và cách nhìn quy củ rất khác.
              - paragraph [ref=e154]: Điều này giúp Bạch Ngọc Kinh có tính chính trị nội bộ. Một thiết chế mạnh vẫn có khác biệt giữa những người đứng đầu, chứ không phải một giọng nói duy nhất.
              - heading "Dư Đấu có vai trò gì tại Bạch Ngọc Kinh?" [level=2] [ref=e155]
              - paragraph [ref=e156]:
                - link "Dư Đấu" [ref=e157] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/du-dau-la-ai/
                - text: thường được độc giả gọi Đạo Lão Nhị, là đệ tử quan trọng của Đạo Tổ và chưởng giáo Bạch Ngọc Kinh. Ông nổi bật ở chiến lực, quy củ và tiên kiếm Đạo Tạng.
              - paragraph [ref=e158]: Chương 948 nhắc “Dư sư huynh vẫn đang ở Bạch Ngọc Kinh chờ”, cho thấy ông ở ngay trung tâm đại cục khi Lục Trầm di chuyển giữa các nơi.
              - paragraph [ref=e159]: Dư Đấu phù hợp với mặt “trật tự–chấp hành” của Bạch Ngọc Kinh, nhưng bài tránh biến toàn bộ chính sách Thanh Minh thành ý chí cá nhân ông.
              - heading "Lục Trầm đại diện mặt nào của Bạch Ngọc Kinh?" [level=2] [ref=e160]
              - paragraph [ref=e161]:
                - link "Lục Trầm" [ref=e162] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/luc-tram-la-ai/
                - text: "là chưởng giáo có phong cách rất khác: biến hóa, thích đi xa, can dự nhân quả và thường xuất hiện ở nơi khó đoán."
              - paragraph [ref=e163]: "Chương 974 chính là cảnh Lục Trầm ở tầng cao nhất Bạch Ngọc Kinh, nhàn nhã nhìn xuống Ngũ Thành Thập Nhị Lâu. Hình ảnh này rất hợp nhân vật: ở vị trí quyền lực cực cao nhưng cách thể hiện không nặng nghi lễ."
              - paragraph [ref=e164]: Sự tồn tại đồng thời của Dư Đấu và Lục Trầm cho thấy hệ thống đủ lớn để chứa những phong cách trị đạo rất khác nhau.
              - heading "Bạch Ngọc Kinh có quan hệ gì với Đạo Tổ?" [level=2] [ref=e165]
              - paragraph [ref=e166]:
                - link "Đạo Tổ" [ref=e167] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/dao-to-la-ai/
                - text: là nguồn đạo thống cao nhất của Thanh Minh. Hệ chưởng giáo Bạch Ngọc Kinh thuộc truyền thừa trực tiếp từ ông, khiến thiết chế này có chính danh đại đạo vượt xa một tổ chức thế tục.
              - paragraph [ref=e168]: Vì vậy Bạch Ngọc Kinh vừa quản trị vừa đại diện cho một cách hiểu về Đạo gia. Khi nó ban pháp chỉ, sức nặng đến từ cả tổ chức lẫn truyền thừa.
              - paragraph [ref=e169]: "Đây là điểm khác với hoàng đế: quyền lực hoàng đế dựa nhà nước và quốc vận; Bạch Ngọc Kinh dựa vào hệ đạo thống cùng sức mạnh của chưởng giáo."
              - heading "Thanh Minh Thiên Hạ có 14 châu?" [level=2] [ref=e170]
              - paragraph [ref=e171]:
                - text: Có. Chương 948 nhắc rõ
                - strong [ref=e172]: Thanh Minh 14 châu
                - text: . Đây là một trong những con số địa lý quan trọng nhất để phân biệt Thanh Minh với Hạo Nhiên có chín châu.
              - paragraph [ref=e173]: Điều đáng chú ý là cấu trúc địa lý hai thiên hạ cũng khác. Hạo Nhiên giống các khối lục địa/châu nổi giữa bốn biển; Thanh Minh được chính văn mô tả như 14 châu bị những đại thủy đạo lớn cắt chia.
              - paragraph [ref=e174]: Vì vậy Bạch Ngọc Kinh phải quản một thiên hạ có địa lý vận hành khác Hạo Nhiên, không thể chỉ “copy mô hình Văn Miếu”.
              - heading "Các đại độc chia cắt Thanh Minh có ý nghĩa gì?" [level=2] [ref=e175]
              - paragraph [ref=e176]:
                - text: Chương 948 mô tả núi sông dưới mặt đất như rồng rắn uốn lượn và nói Thanh Minh 14 châu giống như bị các
                - strong [ref=e177]: đại độc
                - text: cắt ra.
              - paragraph [ref=e178]:
                - text: “Đại độc” ở đây là chữ 渎 chỉ đại thủy đạo, không liên quan tên riêng
                - link "Tề Độ (齐渡)" [ref=e179] [cursor=pointer]:
                  - /url: https://doctieuthuyet.com/te-do-la-gi/
                - text: . Đây là một điểm Hán–Việt rất dễ nhầm mà cluster đã chuẩn hóa.
              - paragraph [ref=e180]: Hệ đại thủy đạo làm địa lý Thanh Minh có tính tuyến và chia cắt mạnh, từ đó ảnh hưởng giao thông, biên giới và cách Bạch Ngọc Kinh kiểm soát các châu.
              - heading "Bạch Ngọc Kinh quản Thanh Minh chặt tới mức nào?" [level=2] [ref=e181]
