                - strong [ref=e92]: hệ thống đạo thống–quản trị cấp thiên hạ
                - text: ": có thành, lầu, đạo quan, tiên quân, pháp chỉ, chưởng giáo và các tầng quyền lực có thể trực tiếp ảnh hưởng trật tự 14 châu."
